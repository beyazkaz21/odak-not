 <!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Odak Not Pro</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f0f0f;
    color:white;
}

header{
    padding:15px;
    text-align:center;
    font-size:22px;
    background:#1c1c1c;
}

.container{
    display:flex;
    gap:15px;
    padding:15px;
}

.panel{
    flex:1;
    background:#1e1e1e;
    padding:15px;
    border-radius:10px;
}

input,textarea,button{
    width:100%;
    margin-top:10px;
    padding:10px;
    border:none;
    border-radius:6px;
}

button{
    background:#00aaff;
    color:white;
    cursor:pointer;
}

.note{
    padding:10px;
    margin-top:10px;
    border-radius:8px;
}

.small{
    font-size:12px;
    opacity:0.7;
}

.top{
    display:flex;
    justify-content:space-between;
}
</style>
</head>

<body>

<header>🔥 ODAK NOT PRO</header>

<div class="container">

<!-- SOL PANEL -->
<div class="panel">
<h3>Not Ekle</h3>

<input id="title" placeholder="Başlık">
<textarea id="text" placeholder="Not"></textarea>
<input id="color" type="color">
<input id="password" placeholder="Şifre (opsiyonel)">
<label><input type="checkbox" id="pin"> Sabitle</label>

<button onclick="addNote()">Kaydet</button>
</div>

<!-- SAĞ PANEL -->
<div class="panel">
<h3>Notlar</h3>

<input id="search" oninput="render()" placeholder="Ara...">

<div id="notes"></div>
</div>

</div>

<script>
let notes = JSON.parse(localStorage.getItem("notes")) || [];

function save(){
    localStorage.setItem("notes", JSON.stringify(notes));
}

function addNote(){
    let n = {
        title: title.value,
        text: text.value,
        color: color.value,
        password: password.value,
        pin: pin.checked,
        time: Date.now()
    };

    if(!n.title || !n.text) return alert("Boş bırakma!");

    notes.push(n);
    save();
    render();
}

function render(){
    let box = document.getElementById("notes");
    let q = document.getElementById("search").value.toLowerCase();

    box.innerHTML = "";

    let sorted = notes.sort((a,b)=> b.pin - a.pin);

    sorted.forEach((n,i)=>{

        if(!n.title.toLowerCase().includes(q) &&
           !n.text.toLowerCase().includes(q)) return;

        let div = document.createElement("div");
        div.className = "note";
        div.style.background = n.color;

        div.innerHTML = `
            <div class="top">
                <b>${n.title}</b>
                ${n.pin ? "📌" : ""}
            </div>

            <div class="small">
                ${n.password ? "🔒 Şifreli" : "Açık"} | ${new Date(n.time).toLocaleString()}
            </div>

            <button onclick="openNote(${i})">Aç</button>
            <button onclick="editNote(${i})">Düzenle</button>
            <button onclick="delNote(${i})">Sil</button>
        `;

        box.appendChild(div);
    });
}

function openNote(i){
    let n = notes[i];

    if(n.password){
        let p = prompt("Şifre:");
        if(p !== n.password) return alert("Yanlış şifre!");
    }

    alert(n.title + "\n\n" + n.text);
}

function delNote(i){
    notes.splice(i,1);
    save();
    render();
}

function editNote(i){
    let n = notes[i];

    let p = n.password ? prompt("Şifre:") : "";

    if(n.password && p !== n.password){
        return alert("Yanlış şifre!");
    }

    let newText = prompt("Yeni not:", n.text);
    if(newText){
        notes[i].text = newText;
        save();
        render();
    }
}

render();
</script>

</body>
</html>
