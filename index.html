<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>🔥 Odak Not</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b0b0b;
    color: white;
}

/* HEADER */
.header {
    text-align: center;
    padding: 30px 10px;
}

.header h1 {
    font-size: 32px;
    margin: 0;
}

.header p {
    font-size: 16px;
    opacity: 0.7;
}

/* TOP BAR */
.top-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px;
}

.search {
    padding: 10px;
    width: 200px;
    border-radius: 8px;
    border: none;
}

.add-btn {
    padding: 10px 15px;
    background: #6c5ce7;
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.add-btn:hover {
    background: red;
    transform: scale(1.05);
}

/* FORM */
.form {
    display: none;
    flex-direction: column;
    gap: 10px;
    background: #111;
    padding: 15px;
    margin: 20px auto;
    width: 300px;
    border-radius: 12px;
    animation: fadeIn 0.4s ease;
}

.form input, .form textarea, .form select {
    padding: 10px;
    border-radius: 6px;
    border: none;
}

.save-btn {
    background: green;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
}

/* NOTES */
.notes {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
}

.note {
    width: 200px;
    padding: 15px;
    border-radius: 12px;
    color: white;
    position: relative;
    animation: pop 0.3s ease;
    transition: 0.3s;
}

.note:hover {
    transform: scale(1.05);
}

.delete {
    position: absolute;
    top: 5px;
    right: 10px;
    cursor: pointer;
}

/* ANIMATIONS */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(-10px);}
    to {opacity: 1; transform: translateY(0);}
}

@keyframes pop {
    from {transform: scale(0.8);}
    to {transform: scale(1);}
}
</style>
</head>

<body>

<div class="header">
    <h1>🔥 Odak Not</h1>
    <p>Şifreli Not Defteri</p>
</div>

<div class="top-bar">
    <input type="text" id="search" class="search" placeholder="Ara...">
    <button class="add-btn" onclick="toggleForm()">+ Not Ekle</button>
</div>

<div class="form" id="form">
    <input type="text" id="title" placeholder="Başlık">
    <textarea id="content" placeholder="Not yaz..."></textarea>
    <input type="password" id="password" placeholder="Şifre (isteğe bağlı)">
    
    <select id="color">
        <option value="#e74c3c">Kırmızı</option>
        <option value="#3498db">Mavi</option>
        <option value="#2ecc71">Yeşil</option>
        <option value="#f1c40f">Sarı</option>
    </select>

    <button class="save-btn" onclick="saveNote()">Kaydet</button>
</div>

<div class="notes" id="notes"></div>

<script>
let notes = JSON.parse(localStorage.getItem("notes")) || [];

function toggleForm() {
    const form = document.getElementById("form");
    form.style.display = form.style.display === "flex" ? "none" : "flex";
}

function saveNote() {
    const title = document.getElementById("title").value;
    const content = document.getElementById("content").value;
    const password = document.getElementById("password").value;
    const color = document.getElementById("color").value;

    const note = { title, content, password, color };
    notes.push(note);

    localStorage.setItem("notes", JSON.stringify(notes));
    renderNotes();
}

function deleteNote(index) {
    notes.splice(index, 1);
    localStorage.setItem("notes", JSON.stringify(notes));
    renderNotes();
}

function renderNotes() {
    const container = document.getElementById("notes");
    container.innerHTML = "";

    notes.forEach((note, index) => {
        const div = document.createElement("div");
        div.className = "note";
        div.style.background = note.color;

        div.innerHTML = `
            <span class="delete" onclick="deleteNote(${index})">❌</span>
            <h3>${note.title}</h3>
            <p>${note.password ? "🔒 Şifreli" : note.content}</p>
        `;

        div.onclick = () => {
            if (note.password) {
                let input = prompt("Şifre gir:");
                if (input === note.password) {
                    alert(note.content);
                } else {
                    alert("Yanlış şifre!");
                }
            }
        };

        container.appendChild(div);
    });
}

renderNotes();
</script>

</body>
</html>
