<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odak Not</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0a0a0a;
    color:white;
}

/* HEADER */
header{
    text-align:center;
    padding:25px;
}

header h1{
    font-size:34px;
}

header p{
    font-size:18px;
    color:#aaa;
}

/* TOP BAR */
#bar{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    padding:10px;
}

button{
    padding:14px 22px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    background:#222;
    color:white;
    font-size:16px;
    transition:.2s;
}

button:hover{
    background:red;
    transform:scale(1.08);
}

#search{
    padding:12px;
    border-radius:10px;
    border:0;
    background:#222;
    color:white;
    font-size:16px;
    width:220px;
}

/* NOTES */
#notes{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:18px;
    padding:20px;
}

.note{
    width:240px;
    min-height:150px;
    padding:15px;
    border-radius:12px;
    cursor:pointer;
    transition:.25s;
    font-size:16px;
}

.note b{
    font-size:18px;
}

.note:hover{
    transform:scale(1.06);
    box-shadow:0 0 20px red;
}

/* COLORS */
.red{background:#3a0000;}
.blue{background:#001133;}
.green{background:#003300;}
.yellow{background:#333300;}

/* MODAL */
#modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    justify-content:center;
    align-items:center;
}

.box{
    background:#111;
    padding:22px;
    border-radius:12px;
    width:320px;
}

input,textarea,select{
    width:100%;
    margin:6px 0;
    padding:10px;
    border:0;
    border-radius:8px;
    background:#222;
    color:white;
    font-size:16px;
}

textarea{
    height:120px;
}

.save{
    background:green;
    font-size:16px;
}

.save:hover{
    background:#00ff88;
}
</style>
</head>

<body>

<header>
    <h1>🔥 Odak Not</h1>
    <p>Şifreli Not Defteri</p>
</header>

<div id="bar">
    <button id="add">➕ Not Ekle</button>
    <input id="search" placeholder="Not ara...">
</div>

<div id="notes"></div>

<!-- MODAL -->
<div id="modal">
    <div class="box">
        <input id="title" placeholder="Başlık">
        <textarea id="text" placeholder="Not yaz..."></textarea>
        <input id="pass" type="password" placeholder="Şifre (opsiyonel)">

        <select id="color">
            <option value="red">Kırmızı</option>
            <option value="blue">Mavi</option>
            <option value="green">Yeşil</option>
            <option value="yellow">Sarı</option>
        </select>

        <button class="save" id="save">Kaydet</button>
    </div>
</div>

<script>
let notes = JSON.parse(localStorage.getItem("notes")) || [];
let edit = null;

const add = document.getElementById("add");
const modal = document.getElementById("modal");
const save = document.getElementById("save");

const title = document.getElementById("title");
const text = document.getElementById("text");
const pass = document.getElementById("pass");
const color = document.getElementById("color");

const notesDiv = document.getElementById("notes");
const search = document.getElementById("search");

/* OPEN */
add.onclick = () => {
    modal.style.display = "flex";
    edit = null;

    add.style.transform = "scale(1.1)";
    setTimeout(()=>add.style.transform="scale(1)",200);
};

/* SAVE */
save.onclick = () => {

let n = {
title:title.value,
text:text.value,
pass:pass.value,
color:color.value
};

if(edit==null) notes.push(n);
else notes[edit]=n;

localStorage.setItem("notes",JSON.stringify(notes));
modal.style.display="none";
render();
}

/* RENDER */
function render(){
notesDiv.innerHTML="";

let f = search.value.toLowerCase();

notes.forEach((n,i)=>{

if(n.title.toLowerCase().includes(f) || n.text.toLowerCase().includes(f)){

let d = document.createElement("div");
d.className="note "+n.color;

d.innerHTML = `<b>${n.title}</b><br><br>${n.text.slice(0,60)}`;

d.onclick=()=>{
if(n.pass){
let p = prompt("Şifre gir:");
if(p!=n.pass){alert("Yanlış şifre!");return;}
}

title.value=n.title;
text.value=n.text;
pass.value=n.pass;
color.value=n.color;

edit=i;
modal.style.display="flex";
}

notesDiv.appendChild(d);
}
});
}

search.oninput=render;

render();
</script>

</body>
</html>
