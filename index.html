<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odak Not</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
background:#0a0a0a;
color:white;
font-family:Arial;
}

header{
text-align:center;
padding:25px;
}

h1{font-size:34px;}

#bar{
display:flex;
gap:10px;
align-items:center;
padding:10px 15px;
}

button{
padding:12px 16px;
border:none;
border-radius:8px;
cursor:pointer;
background:#222;
color:white;
}

button:hover{background:red;}

#search{
width:140px;
padding:8px;
border:none;
border-radius:6px;
background:#222;
color:white;
}

#notes{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
padding:20px;
}

.note{
width:260px;
min-height:150px;
padding:15px;
border-radius:12px;
cursor:pointer;
font-size:18px;
}

.red{background:#3a0000;}
.blue{background:#001133;}
.green{background:#003300;}
.yellow{background:#333300;}

#modal,#passModal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
justify-content:center;
align-items:center;
}

.box{
background:#111;
padding:20px;
border-radius:10px;
width:340px;
}

input,textarea,select{
width:100%;
margin:6px 0;
padding:10px;
border:none;
border-radius:6px;
background:#222;
color:white;
}

textarea{height:120px;}

.save{background:green;}
.delete{background:#aa0000;}
.delete:hover{background:red;}
</style>
</head>

<body>

<header>
<h1>🔥 Odak Not</h1>
</header>

<div id="bar">
<button id="add">➕ Not Ekle</button>
<input id="search" placeholder="Ara...">
</div>

<div id="notes"></div>

<!-- Not modal -->
<div id="modal">
<div class="box">
<input id="title" placeholder="Başlık">
<textarea id="text" placeholder="Not"></textarea>
<input id="pass" type="password" placeholder="Şifre (opsiyonel)">
<select id="color">
<option value="red">Kırmızı</option>
<option value="blue">Mavi</option>
<option value="green">Yeşil</option>
<option value="yellow">Sarı</option>
</select>

<button class="save" id="save">Kaydet</button>
<button class="delete" id="delete">Sil</button>
</div>
</div>

<!-- Şifre ekranı -->
<div id="passModal">
<div class="box">
<h3>Şifre Gir</h3>
<input id="passInput" type="password" placeholder="Şifre">
<button class="save" id="unlock">Aç</button>
</div>
</div>

<script>
let notes = JSON.parse(localStorage.getItem("notes")) || [];
let edit = null;
let openIndex = null;

const add = document.getElementById("add");
const modal = document.getElementById("modal");
const passModal = document.getElementById("passModal");

const title = document.getElementById("title");
const text = document.getElementById("text");
const pass = document.getElementById("pass");
const color = document.getElementById("color");

const notesDiv = document.getElementById("notes");
const search = document.getElementById("search");

const passInput = document.getElementById("passInput");

add.onclick = () => {
edit = null;
modal.style.display="flex";
};

document.getElementById("save").onclick = () => {

let n = {
title:title.value,
text:text.value,
pass:pass.value,
color:color.value
};

if(edit==null) notes.push(n);
else notes[edit]=n;

localStorage.setItem("notes",JSON.stringify(notes));
modal.style.display="none";
render();
};

document.getElementById("delete").onclick = () => {
if(edit!=null){
notes.splice(edit,1);
localStorage.setItem("notes",JSON.stringify(notes));
}
modal.style.display="none";
render();
};

function render(){
notesDiv.innerHTML="";

let f = search.value.toLowerCase();

notes.forEach((n,i)=>{

if(n.title.toLowerCase().includes(f) || n.text.toLowerCase().includes(f)){

let d = document.createElement("div");
d.className="note "+n.color;

d.innerHTML=`<b>${n.title}</b>`;

d.onclick=()=>{
openIndex=i;

if(n.pass && n.pass.length>0){
passModal.style.display="flex";
passInput.value="";
}else{
openNote(i);
}
};

notesDiv.appendChild(d);
}
});
}

function openNote(i){
let n = notes[i];

title.value=n.title;
text.value=n.text;
pass.value=n.pass;
color.value=n.color;

edit=i;
modal.style.display="flex";
}

document.getElementById("unlock").onclick = () => {
if(notes[openIndex].pass === passInput.value){
passModal.style.display="none";
openNote(openIndex);
}else{
alert("Yanlış şifre!");
}
};

search.oninput=render;

render();
</script>

</body>
</html>
