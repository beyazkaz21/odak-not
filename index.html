<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odak Not</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0a0a0a;
color:white;
}

header{
text-align:center;
padding:20px;
}

header h1{
font-size:30px;
}

#bar{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
padding:10px;
}

button{
padding:12px 18px;
border:0;
border-radius:8px;
cursor:pointer;
background:#222;
color:white;
font-size:14px;
}

button:hover{
background:red;
}

#search{
padding:10px;
border-radius:8px;
border:0;
background:#222;
color:white;
}

#notes{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
padding:20px;
}

.note{
width:200px;
min-height:120px;
padding:10px;
border-radius:10px;
cursor:pointer;
transition:.2s;
}

.note:hover{
transform:scale(1.05);
box-shadow:0 0 15px red;
}

.red{background:#3a0000;}
.blue{background:#001133;}
.green{background:#003300;}
.yellow{background:#333300;}

#modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.8);
justify-content:center;
align-items:center;
}

.box{
background:#111;
padding:20px;
border-radius:10px;
width:300px;
}

input,textarea,select{
width:100%;
margin:5px 0;
padding:8px;
border:0;
border-radius:6px;
background:#222;
color:white;
}

textarea{height:100px;}

.save{
background:green;
}
</style>
</head>

<body>

<header>
<h1>🔥 Odak Not</h1>
<p>Şifreli Not Defteri</p>
</header>

<div id="bar">
<button id="add">➕ Not Ekle</button>
<input id="search" placeholder="Ara...">
</div>

<div id="notes"></div>

<div id="modal">
<div class="box">
<input id="title" placeholder="Başlık">
<textarea id="text" placeholder="Not"></textarea>
<input id="pass" type="password" placeholder="Şifre (opsiyonel)">

<select id="color">
<option value="red">Kırmızı</option>
<option value="blue">Mavi</option>
<option value="green">Yeşil</option>
<option value="yellow">Sarı</option>
</select>

<button class="save" id="save">Kaydet</button>
</div>
</div>

<script>
let notes = JSON.parse(localStorage.getItem("notes")) || [];
let edit = null;

const add = document.getElementById("add");
const modal = document.getElementById("modal");
const save = document.getElementById("save");

const title = document.getElementById("title");
const text = document.getElementById("text");
const pass = document.getElementById("pass");
const color = document.getElementById("color");

const notesDiv = document.getElementById("notes");
const search = document.getElementById("search");

add.onclick = () => {
modal.style.display="flex";
edit=null;
};

save.onclick = () => {

let n = {
title:title.value,
text:text.value,
pass:pass.value,
color:color.value
};

if(edit==null) notes.push(n);
else notes[edit]=n;

localStorage.setItem("notes",JSON.stringify(notes));
modal.style.display="none";
render();
};

function render(){
notesDiv.innerHTML="";

let f = search.value.toLowerCase();

notes.forEach((n,i)=>{

if(n.title.toLowerCase().includes(f) || n.text.toLowerCase().includes(f)){

let d = document.createElement("div");
d.className="note "+n.color;

d.innerHTML=`<b>${n.title}</b><br>${n.text.slice(0,40)}`;

d.onclick=()=>{
if(n.pass){
let p = prompt("Şifre:");
if(p!=n.pass){alert("Yanlış!");return;}
}

title.value=n.title;
text.value=n.text;
pass.value=n.pass;
color.value=n.color;

edit=i;
modal.style.display="flex";
};

notesDiv.appendChild(d);
}
});
}

search.oninput=render;
render();
</script>

</body>
</html>
