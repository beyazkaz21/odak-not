<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Dark Note</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0a0a0a;
    color: white;
    overflow-x: hidden;
}

/* ARKA PLAN ANİMASYONU */
body::before {
    content: "";
    position: fixed;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, #6c5ce7 1px, transparent 1px);
    background-size: 50px 50px;
    animation: moveBg 20s linear infinite;
    opacity: 0.1;
}

@keyframes moveBg {
    from { transform: translate(0,0); }
    to { transform: translate(-50px,-50px); }
}

/* HEADER */
.header {
    text-align: center;
    padding: 30px 10px;
}

.header h1 {
    font-size: 38px;
}

.header p {
    font-size: 18px;
    opacity: 0.7;
}

/* ARAMA */
.search-bar {
    display: flex;
    justify-content: center;
    margin-top: 20px;
}

.search {
    width: 520px;
    padding: 16px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    background: #2a2a2a; /* gri */
    color: white;
    outline: none;
    transition: 0.3s;
}

.search:focus {
    box-shadow: 0 0 10px #6c5ce7;
}

/* BUTON */
.add-container {
    text-align: center;
    margin: 25px;
}

.add-btn {
    padding: 16px 30px;
    background: #5f27cd; /* eski mora yakın */
    border: none;
    border-radius: 14px;
    color: white;
    cursor: pointer;
    font-size: 18px;
    transition: 0.3s;
}

.add-btn:hover {
    background: #e74c3c;
    transform: scale(1.15);
}

/* FORM */
.form {
    display: none;
    flex-direction: column;
    gap: 15px;
    background: #111;
    padding: 25px;
    margin: 20px auto;
    width: 420px;
    border-radius: 15px;
    animation: fadeIn 0.4s ease;
}

.form input,
.form textarea,
.form select {
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 16px;
    background: #2a2a2a;
    color: white;
}

.form textarea {
    height: 120px;
}

.save-btn {
    background: #00b894;
    padding: 14px;
    border-radius: 10px;
    border: none;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

/* NOTLAR */
.notes {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    padding: 20px;
}

.note {
    width: 240px;
    padding: 18px;
    border-radius: 15px;
    position: relative;
    transition: 0.3s;
    animation: pop 0.3s ease;
}

.note:hover {
    transform: scale(1.08);
}

.delete {
    position: absolute;
    top: 8px;
    right: 12px;
    cursor: pointer;
}

/* ANİMASYON */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(-10px);}
    to {opacity: 1;}
}

@keyframes pop {
    from {transform: scale(0.8);}
    to {transform: scale(1);}
}
</style>
</head>

<body>

<div class="header">
    <h1>🌙 Dark Note</h1>
    <p>Şifreli Not Defteri</p>
</div>

<!-- ARA -->
<div class="search-bar">
    <input type="text" id="search" class="search" placeholder="Not ara...">
</div>

<!-- NOT EKLE -->
<div class="add-container">
    <button class="add-btn" onclick="toggleForm()">+ Not Ekle</button>
</div>

<!-- FORM -->
<div class="form" id="form">
    <input type="text" id="title" placeholder="Başlık">
    <textarea id="content" placeholder="Notunu yaz..."></textarea>
    <input type="password" id="password" placeholder="Şifre (isteğe bağlı)">

    <select id="color">
        <option value="#e74c3c">Kırmızı</option>
        <option value="#3498db">Mavi</option>
        <option value="#2ecc71">Yeşil</option>
        <option value="#f1c40f">Sarı</option>
    </select>

    <button class="save-btn" onclick="saveNote()">Kaydet</button>
</div>

<div class="notes" id="notes"></div>

<script>
let notes = JSON.parse(localStorage.getItem("notes")) || [];

function toggleForm() {
    const form = document.getElementById("form");
    form.style.display = form.style.display === "flex" ? "none" : "flex";
}

function saveNote() {
    const title = document.getElementById("title").value;
    const content = document.getElementById("content").value;
    const password = document.getElementById("password").value;
    const color = document.getElementById("color").value;

    notes.push({ title, content, password, color });
    localStorage.setItem("notes", JSON.stringify(notes));

    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
    document.getElementById("password").value = "";

    renderNotes();
}

function deleteNote(i) {
    notes.splice(i, 1);
    localStorage.setItem("notes", JSON.stringify(notes));
    renderNotes();
}

function renderNotes() {
    const container = document.getElementById("notes");
    const search = document.getElementById("search").value.toLowerCase();

    container.innerHTML = "";

    notes.forEach((note, i) => {
        if (!note.title.toLowerCase().includes(search)) return;

        const div = document.createElement("div");
        div.className = "note";
        div.style.background = note.color;

        div.innerHTML = `
            <span class="delete" onclick="deleteNote(${i})">❌</span>
            <h3>${note.title}</h3>
            <p>${note.password ? "🔒 Şifreli" : note.content}</p>
        `;

        div.onclick = () => {
            if (note.password) {
                let input = prompt("Şifre gir:");
                if (input === note.password) {
                    alert(note.content);
                } else {
                    alert("Yanlış şifre!");
                }
            }
        };

        container.appendChild(div);
    });
}

document.getElementById("search").addEventListener("input", renderNotes);

renderNotes();
</script>

</body>
</html>
