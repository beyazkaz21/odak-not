<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odak Not | Not Defteri</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins', sans-serif;}
body{background:#0a0a0a;color:#eaeaea;text-align:center;}
h1{margin:30px 0;font-weight:600;}

#controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}

#addNote{
padding:15px 35px;font-size:18px;border:none;border-radius:12px;
cursor:pointer;background:#1a1a1a;color:white;transition:0.3s;
}
#addNote:hover{background:red;transform:scale(1.1) rotate(-2deg);}

#searchInput{
padding:12px;width:250px;border-radius:10px;border:none;
font-size:16px;background:#1a1a1a;color:white;
}

.notes{
display:flex;flex-wrap:wrap;justify-content:center;gap:25px;padding:30px;
}

.note{
width:230px;min-height:150px;border-radius:15px;padding:20px;
cursor:pointer;transition:0.3s;position:relative;
backdrop-filter:blur(6px);
box-shadow:0 8px 25px rgba(255,0,0,0.2);
}

.note h3{margin-bottom:10px;}
.note p{font-size:14px;}

.note[data-color="kirmizi"]{background:#330000;}
.note[data-color="mavi"]{background:#001133;}
.note[data-color="yesil"]{background:#003300;}
.note[data-color="sari"]{background:#333300;}

.note:hover{
transform:translateY(-5px) scale(1.03);
box-shadow:0 12px 35px rgba(255,0,0,0.4);
}

.modal{
display:none;position:fixed;inset:0;
backdrop-filter:blur(8px);
background:rgba(0,0,0,0.8);
justify-content:center;align-items:center;
}

.modal-content{
width:700px;max-width:95%;
background:#111;padding:40px;border-radius:20px;
}

input,select,textarea{
width:100%;padding:12px;margin-bottom:15px;
background:#1a1a1a;border:none;border-radius:10px;color:white;
}

textarea{height:250px;resize:none;}

.buttons{display:flex;justify-content:flex-end;gap:10px;}

button{
padding:10px 20px;border:none;border-radius:8px;
cursor:pointer;
}

.saveBtn{background:#00aa55;color:white;}
.saveBtn:hover{background:#00ff88;}

.deleteBtn{background:#aa0000;color:white;}
.deleteBtn:hover{background:red;}
</style>
</head>

<body>

<h1>🔥 Odak Not</h1>

<div id="controls">
    <button id="addNote">➕ Not Ekle</button>
    <input type="text" id="searchInput" placeholder="Notlarda ara...">
</div>

<div class="notes" id="notesContainer"></div>

<!-- Not Modal -->
<div class="modal" id="modal">
    <div class="modal-content">
        <input type="text" id="noteTitle" placeholder="Başlık">
        <textarea id="noteText" placeholder="Not"></textarea>

        <input type="password" id="notePassword" placeholder="Not şifresi (isteğe bağlı)">
        
        <select id="noteColor">
            <option value="kirmizi">Kırmızı</option>
            <option value="mavi">Mavi</option>
            <option value="yesil">Yeşil</option>
            <option value="sari">Sarı</option>
        </select>

        <div class="buttons">
            <button class="saveBtn" onclick="saveNote()">Kaydet</button>
            <button class="deleteBtn" onclick="deleteNote()">Sil</button>
        </div>
    </div>
</div>

<script>
let notes = JSON.parse(localStorage.getItem("notes")) || [];
let currentIndex = null;

const addBtn=document.getElementById("addNote");
const container=document.getElementById("notesContainer");
const modal=document.getElementById("modal");

const titleInput=document.getElementById("noteTitle");
const textInput=document.getElementById("noteText");
const colorSelect=document.getElementById("noteColor");
const passwordInput=document.getElementById("notePassword");
const searchInput=document.getElementById("searchInput");

// NOTLARI GÖSTER
function renderNotes(){
    container.innerHTML="";
    const filter=searchInput.value.toLowerCase();

    notes.forEach((note,index)=>{
        if(note.title.toLowerCase().includes(filter) || note.text.toLowerCase().includes(filter)){
            const div=document.createElement("div");
            div.className="note";
            div.dataset.color=note.color;
            div.innerHTML=`<h3>${note.title}</h3><p>${note.text.substring(0,60)}...</p>`;
            div.onclick=()=>openNote(index);
            container.appendChild(div);
        }
    });
}

// NOT EKLE
addBtn.onclick=()=>{
    currentIndex=null;
    titleInput.value="";
    textInput.value="";
    colorSelect.value="kirmizi";
    passwordInput.value="";
    modal.style.display="flex";
};

// NOT AÇ
function openNote(index){
    currentIndex=index;
    const note=notes[index];

    titleInput.value=note.title;
    textInput.value=note.text;
    colorSelect.value=note.color;
    passwordInput.value=note.password || "";

    modal.style.display="flex";
}

// KAYDET
function saveNote(){
    const note={
        title:titleInput.value,
        text:textInput.value,
        color:colorSelect.value,
        password:passwordInput.value
    };

    if(currentIndex===null){
        notes.push(note);
    }else{
        notes[currentIndex]=note;
    }

    localStorage.setItem("notes",JSON.stringify(notes));
    modal.style.display="none";
    renderNotes();
}

// SİL
function deleteNote(){
    if(currentIndex!==null){
        notes.splice(currentIndex,1);
        localStorage.setItem("notes",JSON.stringify(notes));
    }
    modal.style.display="none";
    renderNotes();
}

// SEARCH
searchInput.oninput=renderNotes;

// MODAL KAPAT
modal.onclick=(e)=>{
    if(e.target===modal) modal.style.display="none";
};

renderNotes();
</script>

</body>
</html>
