 <!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odak Not</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:#0a0a0a;
    color:white;
}

/* HEADER */
header{
    text-align:center;
    padding:25px;
}

header h1{
    font-size:28px;
}

header p{
    color:#aaa;
    margin-top:5px;
}

/* TOP BAR */
#topBar{
    display:flex;
    justify-content:center;
    gap:15px;
    margin:20px;
    flex-wrap:wrap;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    background:#1a1a1a;
    color:white;
    transition:0.3s;
}

button:hover{
    background:red;
    transform:scale(1.08);
}

/* SEARCH */
#search{
    padding:12px;
    border-radius:10px;
    border:none;
    width:220px;
    background:#1a1a1a;
    color:white;
}

/* NOTES */
#notes{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.note{
    width:220px;
    min-height:140px;
    padding:15px;
    border-radius:15px;
    cursor:pointer;
    transition:0.3s;
    position:relative;
}

.note:hover{
    transform:translateY(-6px) scale(1.03);
    box-shadow:0 0 25px red;
}

.note h3{
    margin-bottom:10px;
}

/* COLORS */
.red{background:#3a0000;}
.blue{background:#001133;}
.green{background:#003300;}
.yellow{background:#333300;}

/* MODAL */
#modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    justify-content:center;
    align-items:center;
}

.modalBox{
    background:#111;
    padding:25px;
    border-radius:15px;
    width:400px;
}

input,textarea,select{
    width:100%;
    margin:10px 0;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#1a1a1a;
    color:white;
}

textarea{
    height:120px;
}

/* SAVE */
.save{
    background:green;
}

.save:hover{
    background:#00ff88;
}

/* EFFECT */
.pulse{
    animation:pulse 0.4s ease;
}

@keyframes pulse{
    0%{transform:scale(1); box-shadow:0 0 0 red;}
    50%{transform:scale(1.05); box-shadow:0 0 30px red;}
    100%{transform:scale(1);}
}
</style>
</head>

<body>

<header>
    <h1>🔥 Odak Not</h1>
    <p>Şifreli Not Defteri</p>
</header>

<div id="topBar">
    <button id="addBtn">➕ Not Ekle</button>
    <input id="search" placeholder="Not ara...">
</div>

<div id="notes"></div>

<!-- MODAL -->
<div id="modal">
    <div class="modalBox">
        <input id="title" placeholder="Başlık">
        <textarea id="text" placeholder="Not yaz..."></textarea>
        <input id="pass" type="password" placeholder="Şifre (opsiyonel)">
        
        <select id="color">
            <option value="red">Kırmızı</option>
            <option value="blue">Mavi</option>
            <option value="green">Yeşil</option>
            <option value="yellow">Sarı</option>
        </select>

        <button class="save" onclick="saveNote()">Kaydet</button>
    </div>
</div>

<script>
let notes = JSON.parse(localStorage.getItem("notes")) || [];
let current = null;

const addBtn = document.getElementById("addBtn");
const modal = document.getElementById("modal");

const title = document.getElementById("title");
const text = document.getElementById("text");
const pass = document.getElementById("pass");
const color = document.getElementById("color");

const notesDiv = document.getElementById("notes");
const search = document.getElementById("search");

/* OPEN MODAL */
addBtn.onclick = () => {
    modal.style.display = "flex";
    addBtn.classList.add("pulse");

    setTimeout(() => {
        addBtn.classList.remove("pulse");
    }, 400);

    current = null;
};

/* SAVE NOTE */
function saveNote(){
    let note = {
        title: title.value,
        text: text.value,
        pass: pass.value,
        color: color.value
    };

    if(current === null){
        notes.push(note);
    } else {
        notes[current] = note;
    }

    localStorage.setItem("notes", JSON.stringify(notes));
    modal.style.display = "none";
    render();
}

/* RENDER */
function render(){
    notesDiv.innerHTML = "";

    let filter = search.value.toLowerCase();

    notes.forEach((n,i) => {
        if(n.title.toLowerCase().includes(filter) || n.text.toLowerCase().includes(filter)){
            
            let div = document.createElement("div");
            div.className = "note " + n.color;
            
            div.innerHTML = `
                <h3>${n.title}</h3>
                <p>${n.text.substring(0,50)}...</p>
            `;

            div.onclick = () => {
                if(n.pass){
                    let p = prompt("Şifre gir:");
                    if(p !== n.pass){
                        alert("Yanlış şifre!");
                        return;
                    }
                }

                title.value = n.title;
                text.value = n.text;
                pass.value = n.pass;
                color.value = n.color;

                current = i;
                modal.style.display = "flex";
            };

            notesDiv.appendChild(div);
        }
    });
}

search.oninput = render;

modal.onclick = (e) => {
    if(e.target === modal){
        modal.style.display = "none";
    }
};

render();
</script>

</body>
</html>
